<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoColeta - Solicitações</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6f7;
            color: #222;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 22px;
        }

        header > * {
            max-width: 968px;
            margin-left: auto;
            margin-right: auto;
        }

        header h1 {
            margin: 0 auto 5px;
        }

        main {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
        }

        section {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: bold;
        }

        label.full {
            grid-column: 1 / -1;
        }

        input, select, textarea, button {
            font: inherit;
            padding: 10px;
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        .actions {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            cursor: pointer;
            border: 1px solid #aaa;
            border-radius: 7px;
            background: #fff;
        }

        button.primary {
            background: #286347;
            color: #fff;
            border-color: #286347;
        }

        .status {
            font-weight: bold;
        }

        #mensagem {
            min-height: 22px;
            margin: 10px 0 0;
        }

        fieldset {
            grid-column: 1 / -1;
            min-width: 0;
            border: 1px solid #d9e1dc;
            border-radius: 8px;
            padding: 16px;
        }

        legend {
            font-weight: bold;
            padding: 0 6px;
        }

        .endereco-campos, .item-residuo {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
        }

        .item-residuo {
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto;
            align-items: end;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid #d9e1dc;
        }

        form > label, .item-residuo > label {
            min-width: 0;
        }

        .ajuda {
            font-size: 0.9rem;
            font-weight: normal;
            color: #555;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 700px) {
            form, .endereco-campos, .item-residuo {
                grid-template-columns: 1fr;
            }
            label.full, .actions {
                grid-column: 1;
            }
        }

        h2 {
            margin-top: 0;
            font-size: 1.3rem;
        }

        input, select, textarea {
            width: 100%;
            border: 1px solid #aebbb3;
            border-radius: 6px;
            background: #fff;
        }

        :focus-visible {
            outline: 3px solid #528569;
            outline-offset: 2px;
        }

        button:hover {
            filter: brightness(0.94);
        }

        button.danger {
            color: #a12c2c;
            border-color: #a12c2c;
        }

        .lista {
            display: grid;
            gap: 16px;
            margin-top: 16px;
        }

        .card {
            border: 1px solid #d9e1dc;
            border-radius: 8px;
            padding: 16px;
            overflow-wrap: anywhere;
        }

        .card h3 {
            margin: 0 0 12px;
        }

        .card p {
            margin: 0 0 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .status {
            color: #286347;
        }
    </style>
</head>
<body>
<header>
    <h1>EcoColeta</h1>
    <div>PoC para cadastro e gerenciamento simples de solicitações de descarte.</div>
</header>

<main>
    <section>
        <h2 id="tituloFormulario">Nova solicitação</h2>
        <form id="formSolicitacao">
            <input type="hidden" id="id">

            <label>
                Usuário
                <select id="usuarioId" required disabled aria-describedby="usuariosAviso">
                    <option value="">Carregando usuários...</option>
                </select>
                <span class="ajuda" id="usuariosAviso" role="status"></span>
            </label>

            <label>
                Ponto de coleta
                <select id="pontoColetaId" required disabled aria-describedby="pontosAviso">
                    <option value="">Carregando pontos...</option>
                </select>
                <span class="ajuda" id="pontosAviso" role="status"></span>
            </label>

            <div class="actions">
                <button type="button" id="recarregarOpcoes">Atualizar usuários e pontos</button>
            </div>

            <label class="full">
                Título
                <input id="titulo" type="text" maxlength="80" required>
            </label>

            <fieldset>
                <legend>Endereço da coleta</legend>
                <div class="endereco-campos">
                    <label>Rua <input id="rua" required></label>
                    <label>Número <input id="numero" required></label>
                    <label>Bairro <input id="bairro" required></label>
                    <label>Cidade <input id="cidade" required></label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Itens de resíduo</legend>
                <div id="itens"></div>
                <button type="button" id="adicionarItem">Adicionar item</button>
            </fieldset>

            <label id="campoStatus" style="display:none">
                Status
                <select id="status">
                    <option value="ABERTA">Aberta</option>
                    <option value="CONCLUIDA">Concluída</option>
                </select>
            </label>

            <label class="full">
                Descrição (opcional)
                <textarea id="descricao" maxlength="300" placeholder="Descreva brevemente o material que será descartado"></textarea>
            </label>

            <div class="actions">
                <button class="primary" id="salvar" type="submit" disabled>Cadastrar solicitação</button>
                <button type="button" id="cancelar" style="display:none">Cancelar edição</button>
            </div>
        </form>
        <div id="mensagem" role="status" aria-live="polite"></div>
    </section>

    <section>
        <h2>Solicitações cadastradas</h2>
        <button type="button" onclick="carregarSolicitacoes()">Atualizar lista</button>
        <div id="lista" class="lista"></div>
    </section>
</main>

<script>
    const API = '/api/solicitacoes';
    const form = document.getElementById('formSolicitacao');
    const mensagem = document.getElementById('mensagem');
    const tipos = {
        ELETRONICO: 'Eletrônico',
        PAPEL_PAPELAO: 'Papel e papelão',
        PLASTICO: 'Plástico',
        VIDRO: 'Vidro'
    };
    const titulos = {
        ELETRONICO: 'Descarte de eletrônico',
        PAPEL_PAPELAO: 'Descarte de papel e papelão',
        PLASTICO: 'Descarte de plástico',
        VIDRO: 'Descarte de vidro'
    };

    let solicitacoes = [];
    let tituloPersonalizado = false;
    let salvando = false;
    const usuarios = { dados: [], carregando: true, erro: false };
    const pontos = { dados: [], carregando: true, erro: false };

    function atualizarBotaoSalvar() {
        document.getElementById('salvar').disabled = salvando || usuarios.carregando || pontos.carregando
            || usuarios.erro || pontos.erro || !usuarios.dados.length || !pontos.dados.length;
    }

    function preencherSeletor(id, estado, avisoId, nome, rotulo) {
        const seletor = document.getElementById(id);
        const selecionado = seletor.dataset.selecionado || '';
        let aviso = '';
        let placeholder = `Selecione ${nome}`;
        if (estado.carregando) {
            placeholder = 'Carregando...';
        } else if (estado.erro) {
            placeholder = 'Não foi possível carregar';
            aviso = 'Falha no carregamento. Use “Atualizar usuários e pontos” para tentar novamente.';
        } else if (!estado.dados.length) {
            placeholder = 'Nenhuma opção disponível';
            aviso = id === 'usuarioId'
                ? 'Nenhum usuário cadastrado. Cadastre um usuário pela API e atualize as opções.'
                : 'Nenhum ponto cadastrado. Verifique a inicialização da aplicação e atualize as opções.';
        } else if (selecionado && !estado.dados.some(item => item.id === selecionado)) {
            aviso = `Vínculo anterior indisponível (${selecionado}). Selecione uma opção existente.`;
        }
        seletor.replaceChildren(new Option(placeholder, '', true, true));
        for (const item of estado.dados) {
            seletor.add(new Option(rotulo(item), item.id));
        }
        if (estado.dados.some(item => item.id === selecionado)) seletor.value = selecionado;
        seletor.disabled = estado.carregando || estado.erro || !estado.dados.length;
        const atual = estado.dados.find(item => item.id === selecionado);
        if (!aviso && !estado.carregando && id === 'pontoColetaId' && atual) {
            aviso = atual.endereco;
        }
        document.getElementById(avisoId).textContent = aviso;
        atualizarBotaoSalvar();
    }

    function atualizarSeletores() {
        preencherSeletor('usuarioId', usuarios, 'usuariosAviso', 'um usuário', usuario => usuario.nome);
        preencherSeletor('pontoColetaId', pontos, 'pontosAviso', 'um ponto de coleta',
            ponto => `${ponto.nome} — ${ponto.endereco}${ponto.ativo === false ? ' (inativo)' : ''}`);
    }

    async function carregarOpcoes(url, estado) {
        estado.carregando = true;
        estado.erro = false;
        atualizarSeletores();
        try {
            const resposta = await fetch(url);
            if (!resposta.ok) throw new Error('Falha no carregamento');
            estado.dados = await resposta.json();
        } catch (erro) {
            estado.erro = true;
        } finally {
            estado.carregando = false;
            atualizarSeletores();
            renderizarLista();
        }
    }

    async function carregarRelacionamentos() {
        const botao = document.getElementById('recarregarOpcoes');
        botao.disabled = true;
        await Promise.all([
            carregarOpcoes('/api/usuarios', usuarios),
            carregarOpcoes('/api/pontos', pontos)
        ]);
        botao.disabled = false;
    }

    function nomeDoVinculo(estado, id) {
        if (!id) return 'Não informado';
        return estado.dados.find(item => item.id === id)?.nome || `Não disponível (${id})`;
    }

    function itensDaSolicitacao(solicitacao) {
        if (solicitacao.itens?.length) return solicitacao.itens;
        return solicitacao.tipo ? [{ tipo: solicitacao.tipo, quantidade: solicitacao.quantidade }] : [];
    }

    function adicionarItem(item = {}) {
        const linha = document.createElement('div');
        linha.className = 'item-residuo';
        const tipoLabel = document.createElement('label');
        tipoLabel.textContent = 'Tipo do resíduo';
        const tipo = document.createElement('select');
        tipo.className = 'item-tipo';
        tipo.required = true;
        for (const [valor, nome] of Object.entries(tipos)) {
            tipo.add(new Option(nome, valor));
        }
        tipo.value = item.tipo ?? 'ELETRONICO';
        tipo.addEventListener('change', sugerirTitulo);
        tipoLabel.append(tipo);
        const quantidadeLabel = document.createElement('label');
        quantidadeLabel.textContent = 'Quantidade';
        const quantidade = document.createElement('input');
        quantidade.className = 'item-quantidade';
        quantidade.type = 'number';
        quantidade.min = '1';
        quantidade.max = '2147483647';
        quantidade.step = '1';
        quantidade.required = true;
        quantidade.value = item.quantidade ?? 1;
        quantidadeLabel.append(quantidade);
        const remover = document.createElement('button');
        remover.type = 'button';
        remover.textContent = 'Remover item';
        remover.addEventListener('click', () => {
            if (document.querySelectorAll('.item-residuo').length === 1) {
                mostrarMensagem('Informe pelo menos um item.');
                return;
            }
            linha.remove();
            sugerirTitulo();
        });
        linha.append(tipoLabel, quantidadeLabel, remover);
        document.getElementById('itens').append(linha);
    }

    function sugerirTitulo() {
        const titulo = document.getElementById('titulo');
        if (!tituloPersonalizado || !titulo.value.trim()) {
            titulo.value = titulos[document.querySelector('.item-tipo').value];
            tituloPersonalizado = false;
        }
    }

    function mostrarMensagem(texto) {
        mensagem.textContent = texto;
    }

    function resetarFormulario() {
        form.reset();
        document.getElementById('usuarioId').dataset.selecionado = '';
        document.getElementById('pontoColetaId').dataset.selecionado = '';
        atualizarSeletores();
        document.getElementById('itens').replaceChildren();
        adicionarItem();
        tituloPersonalizado = false;
        sugerirTitulo();
        document.getElementById('salvar').textContent = 'Cadastrar solicitação';
        document.getElementById('id').value = '';
        document.getElementById('status').value = 'ABERTA';
        document.getElementById('campoStatus').style.display = 'none';
        document.getElementById('cancelar').style.display = 'none';
        document.getElementById('tituloFormulario').textContent = 'Nova solicitação';
    }

    async function carregarSolicitacoes() {
        try {
            const resposta = await fetch(API);
            if (!resposta.ok) {
                throw new Error('Não foi possível carregar as solicitações.');
            }

            solicitacoes = await resposta.json();
            renderizarLista();
        } catch (erro) {
            mostrarMensagem(erro.message);
        }
    }

    function renderizarLista() {
        const lista = document.getElementById('lista');
        lista.replaceChildren();

        if (solicitacoes.length === 0) {
            lista.textContent = 'Nenhuma solicitação cadastrada.';
            return;
        }

        for (const solicitacao of solicitacoes) {
            const card = document.createElement('article');
            card.className = 'card';
            const titulo = document.createElement('h3');
            titulo.textContent = solicitacao.titulo;
            const detalhes = document.createElement('p');
            detalhes.textContent = itensDaSolicitacao(solicitacao)
                .map(item => `${tipos[item.tipo] || item.tipo}: ${item.quantidade}`).join(' • ');
            const status = document.createElement('p');
            status.className = 'status';
            status.textContent = `Status: ${solicitacao.status === 'ABERTA' ? 'Aberta' : 'Concluída'}`;
            card.append(titulo, detalhes, status);
            const vinculos = document.createElement('p');
            vinculos.textContent = `Usuário: ${nomeDoVinculo(usuarios, solicitacao.usuarioId)} • Ponto: ${nomeDoVinculo(pontos, solicitacao.pontoColetaId)}`;
            card.append(vinculos);
            const endereco = document.createElement('p');
            const e = solicitacao.endereco;
            endereco.textContent = e ? `${e.rua}, ${e.numero} • ${e.bairro} • ${e.cidade}` : 'Endereço não informado';
            card.append(endereco);
            if (solicitacao.descricao?.trim()) {
                const descricao = document.createElement('p');
                descricao.textContent = solicitacao.descricao;
                card.append(descricao);
            }
            const acoes = document.createElement('div');
            acoes.className = 'actions';
            const editarBotao = document.createElement('button');
            editarBotao.textContent = 'Editar';
            editarBotao.addEventListener('click', () => editar(solicitacao.id));
            const excluirBotao = document.createElement('button');
            excluirBotao.textContent = 'Excluir';
            excluirBotao.className = 'danger';
            excluirBotao.addEventListener('click', () => excluir(solicitacao.id));
            acoes.append(editarBotao, excluirBotao);
            card.append(acoes);
            lista.append(card);
        }
    }

    function editar(id) {
        const solicitacao = solicitacoes.find(item => item.id === id);
        if (!solicitacao) {
            return;
        }

        document.getElementById('id').value = solicitacao.id;
        document.getElementById('usuarioId').dataset.selecionado = solicitacao.usuarioId ?? '';
        document.getElementById('pontoColetaId').dataset.selecionado = solicitacao.pontoColetaId ?? '';
        atualizarSeletores();
        document.getElementById('titulo').value = solicitacao.titulo;
        tituloPersonalizado = true;
        for (const campo of ['rua', 'numero', 'bairro', 'cidade']) {
            document.getElementById(campo).value = solicitacao.endereco?.[campo] ?? '';
        }
        document.getElementById('itens').replaceChildren();
        const itens = itensDaSolicitacao(solicitacao);
        if (itens.length) itens.forEach(adicionarItem);
        else adicionarItem();
        document.getElementById('descricao').value = solicitacao.descricao ?? '';
        document.getElementById('status').value = solicitacao.status;
        document.getElementById('campoStatus').style.display = 'flex';
        document.getElementById('cancelar').style.display = 'inline-block';
        document.getElementById('tituloFormulario').textContent = 'Editar solicitação';
        document.getElementById('salvar').textContent = 'Salvar alterações';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function excluir(id) {
        if (!confirm('Deseja excluir esta solicitação?')) {
            return;
        }

        try {
            const resposta = await fetch(`${API}/${encodeURIComponent(id)}`, { method: 'DELETE' });
            if (!resposta.ok) throw new Error('Não foi possível excluir a solicitação.');
            if (document.getElementById('id').value === id) resetarFormulario();
            mostrarMensagem('Solicitação excluída.');
            await carregarSolicitacoes();
        } catch (erro) {
            mostrarMensagem('Não foi possível excluir a solicitação. Verifique a conexão e tente novamente.');
        }
    }

    async function salvarSolicitacao(event) {
        event.preventDefault();
        if (document.getElementById('salvar').disabled || !form.reportValidity()) return;
        const id = document.getElementById('id').value;
        const dados = {
            usuarioId: document.getElementById('usuarioId').value.trim(),
            pontoColetaId: document.getElementById('pontoColetaId').value.trim(),
            titulo: document.getElementById('titulo').value,
            endereco: Object.fromEntries(['rua', 'numero', 'bairro', 'cidade']
                .map(campo => [campo, document.getElementById(campo).value.trim()])),
            itens: Array.from(document.querySelectorAll('.item-residuo'), linha => ({
                tipo: linha.querySelector('.item-tipo').value,
                quantidade: Number(linha.querySelector('.item-quantidade').value)
            })),
            descricao: document.getElementById('descricao').value
        };

        if (id) {
            dados.status = document.getElementById('status').value;
        }

        salvando = true;
        atualizarBotaoSalvar();
        try {
            const resposta = await fetch(id ? `${API}/${encodeURIComponent(id)}` : API, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            if (resposta.ok) {
                mostrarMensagem(id ? 'Solicitação atualizada.' : 'Solicitação cadastrada.');
                resetarFormulario();
                await carregarSolicitacoes();
            } else {
                const erro = await resposta.json().catch(() => null);
                const detalhes = Object.values(erro?.campos || {}).join(' ');
                mostrarMensagem(detalhes || erro?.mensagem || 'Verifique os dados informados.');
            }
        } catch (erro) {
            mostrarMensagem('Não foi possível salvar. Verifique a conexão e tente novamente.');
        } finally {
            salvando = false;
            atualizarBotaoSalvar();
        }
    }

    for (const id of ['usuarioId', 'pontoColetaId']) {
        document.getElementById(id).addEventListener('change', event => {
            event.target.dataset.selecionado = event.target.value;
            atualizarSeletores();
        });
    }
    document.getElementById('recarregarOpcoes').addEventListener('click', carregarRelacionamentos);

    document.getElementById('titulo').addEventListener('input', () => {
        tituloPersonalizado = document.getElementById('titulo').value.trim() !== '';
    });
    document.getElementById('adicionarItem').addEventListener('click', () => adicionarItem());
    form.addEventListener('submit', salvarSolicitacao);
    document.getElementById('cancelar').addEventListener('click', resetarFormulario);
    // Estado inicial da página.
    resetarFormulario();
    carregarRelacionamentos();
    carregarSolicitacoes();
</script>
</body>
</html>
